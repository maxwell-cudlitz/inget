# Local development stack: the state store, the vector destination, and the embedder.
#
# One PostgreSQL serves both schemas. inget_state and inget_vectors are separate namespaces
# in the same database on purpose — they are written in the same transaction boundary often
# enough that splitting them across servers would buy nothing and cost a distributed commit.
#
# Nothing here is exposed beyond localhost and nothing here is hardened. The credentials are
# fixed and weak because this file is for a laptop; a deployed instance gets its DSN from a
# secret named by INGET_STATE_DSN and INGET_PGVECTOR_DSN, and neither binary listens on a
# socket, so there is no server to authenticate against.
#
# Bring it up, then:
#   export INGET_STATE_DSN='postgres://inget:inget@localhost:5432/inget?sslmode=disable'
#   export INGET_PGVECTOR_DSN="$INGET_STATE_DSN"
#   inget migrate

name: inget

services:
  # pgvector 0.8.0 or newer is required: below it an HNSW scan filters after the index scan,
  # so a search restricted to one view silently loses recall (D9). The pinned tag ships it.
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: inget
      POSTGRES_PASSWORD: inget
      POSTGRES_DB: inget
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Index builds are the slow part of a cold load. These are laptop-scale values; the
    # design's tuning note (maintenance_work_mem 8-16 GB, max_parallel_maintenance_workers
    # = cores/2) is for the machine a real reindex runs on.
    command:
      - postgres
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_parallel_maintenance_workers=2
      - -c
      - shared_buffers=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inget -d inget"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Text Embeddings Inference serving the model config.yaml names by default. Native width
  # is 1024, which is the pinned vector contract (D8), so no Matryoshka truncation is needed
  # on this path.
  #
  # TEI publishes one CPU image per host architecture and they are not multi-arch, so the
  # tag has to match the machine. x86_64 gets a version-pinned tag; aarch64 has no
  # version-pinned CPU tag published at all — cpu-arm64-1.9 and cpu-arm64-1.8 do not
  # exist — so the only option there is the moving cpu-arm64-latest, pinned by digest if you
  # want reproducibility:
  #
  #   TEI_IMAGE_TAG=cpu-arm64-latest docker compose up
  #   TEI_IMAGE_TAG=cpu-arm64-latest@sha256:35c50d7494de22deecdb783b8f5b7e1d05765709bd90071b03469b9440d28656 docker compose up
  #
  # Getting it wrong fails the pull with "no matching manifest for linux/arm64/v8", and since a
  # failed pull aborts the whole `up`, postgres does not start either.
  #
  # On Apple Silicon prefer the Homebrew build regardless — a container gets no Metal or MPS
  # access, so it logs "Starting Qwen3 model on Cpu" where the native router logs "on
  # Metal(MetalDevice(...))". It needs the same two flags below, and it runs in the foreground:
  #
  #   brew install text-embeddings-inference
  #   text-embeddings-router --model-id Qwen/Qwen3-Embedding-0.6B --port 8090 \
  #     --hostname 127.0.0.1 --max-batch-tokens 4096 --max-client-batch-size 64
  #
  # TEI_HOST_PORT moves the published port when something already holds 8080; set
  # models.embedder.base_url in config.local.yaml to match.
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE_TAG:-cpu-1.9}
    # Two of these flags are not tuning, they are what makes the service usable at all.
    #
    # --max-batch-tokens bounds the batch TEI allocates, including the one it runs at warmup.
    # The CPU default is 16384, and a 16384-token forward pass of this model was OOM-killed
    # (exit 137) on a Docker VM with 7.75 GB, six seconds after "Warming up model" and before
    # the HTTP port ever opened — which reads like a hang rather than a failure. 4096 warms up
    # and still exceeds anything inget sends: generated view text is bounded by
    # models.generator.max_output_tokens, and passthrough text by compose.max_chars.
    #
    # --max-client-batch-size is the number of inputs one request may carry, and its default
    # is 32 while config.yaml sets models.embedder.batch_size: 64. Left alone, every full
    # batch inget sends is rejected.
    #
    # Note --auto-truncate defaults to true, so an input over the batch-token bound is
    # silently shortened rather than refused. Nothing inget sends comes close; if you raise
    # compose.max_chars past roughly 16k characters, revisit this.
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-0.6B
      - --port
      - "8080"
      - --max-batch-tokens
      - "4096"
      - --max-client-batch-size
      - "64"
    ports:
      - "127.0.0.1:${TEI_HOST_PORT:-8080}:8080"
    volumes:
      - embedder-cache:/data
    environment:
      HF_HOME: /data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      # The first start downloads about 1.2 GB of weights.
      retries: 60
      start_period: 60s

volumes:
  postgres-data:
  embedder-cache:
