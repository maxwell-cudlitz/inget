# Base configuration for both binaries. Precedence, highest wins:
#   environment variables -> config.local.yaml -> config.yaml
#
# Environment nesting uses double underscores after the INGET_ prefix:
#   INGET_MODELS__GENERATOR__MODEL sets models.generator.model
#
# Scalar settings are env-overridable. List-valued settings (sources, destinations,
# datatypes) are not addressable by environment variable — override those through
# config.local.yaml. See docs/feature-design.md, "Configuration".
#
# Secrets never appear here. Config names the environment variable that holds a secret
# (`*_env`) and the process reads it at startup.

version: 1

log:
  level: info          # LOG_LEVEL: debug|info|warn|error
  format: json         # LOG_FORMAT: json|text
  destination: stderr  # LOG_DESTINATION: stderr|stdout

artifacts:
  url: "file://./.inget/artifacts"     # or s3://bucket/prefix, gs://bucket/prefix
  shard_target_bytes: 134217728        # 128 MiB uncompressed per JSONL shard
  blob_max_bytes: 1048576              # per-fragment content cap
  max_fragments_per_item: 2000         # excess is dropped, recorded, and warned
  compression: zstd

retention:
  runs: 30d                            # run directories kept before gc
  missing_runs: 3                      # runs a fragment may be absent before its
                                       # derivations are collected

enrich:
  max_reference_depth: 2               # reference resolution depth bound
  max_cascade_per_run: 5000            # cascaded invalidations; remainder deferred

# `inget eval` (D14). The harness re-embeds stored view text and never generates, so it
# needs no generator credentials. The sample is also the retrieval pool: scores only
# compare across runs at a fixed sample_size.
eval:
  sample_size: 20                      # items with stored views sampled per datatype
  thresholds:                          # floors; a breach exits non-zero
    self_retrieval: 0.80               # a view's nearest neighbour is its own item
    distinctiveness: 0.05              # mean cosine distance between different items
    view_coverage: 0.90                # configured views with non-empty stored text
    view_distinctiveness: 0.05         # mean cosine distance between views of one item
    metadata_top3: 0.60                # metadata query finds the item in the top 3

state:
  driver: postgres                     # postgres | sqlite
  dsn_env: INGET_STATE_DSN
  # path: ./.inget/state.db            # sqlite only

models:
  generator:
    driver: openai
    base_url: "http://localhost:4000/v1"
    model: "deepseek-v4-flash"
    api_key_env: INGET_GENERATOR_API_KEY
    temperature: 0
    seed: 1
    max_output_tokens: 1024
    # The input bound is a guard against a prompt this client should not send, not a tuning
    # knob for quality: it is deliberately far above compose.max_chars so that the composed
    # document, not the transport, decides how much a view reads. V4's context is a million
    # tokens, and 1.2M characters is about 300k of them.
    max_input_chars: 1200000
    concurrency: 8
    # A composed document of a million characters is a slow call. This bounds one request, and
    # it is not part of any signature, so raising it invalidates nothing.
    timeout: 300s
    price_per_mtok_in: 0.14            # for `inget plan` cost estimates
    price_per_mtok_out: 0.28
    # Merged into the chat completion request body, for parameters a provider adds to the
    # OpenAI shape. Every key here feeds the generator signature, so changing one invalidates
    # cached derivations and views — which is correct, since it changes what the model returns.
    #
    # DeepSeek V4 enables thinking by default, and reasoning tokens are spent from
    # max_output_tokens and billed at the output rate. Left on, a 1024-token budget is consumed
    # by reasoning before the answer starts and every view fails with finish_reason "length";
    # temperature and seed are also ignored while it is on, so the determinism this pipeline's
    # cache keys claim would not exist. These are summarisation tasks: the reasoning buys
    # nothing and costs the budget.
    request_options:
      thinking:
        type: disabled
  embedder:
    driver: openai
    base_url: "http://localhost:8080/v1"
    model: "Qwen/Qwen3-Embedding-0.6B"
    dimensions: 1024
    truncate_dims: 0                   # MRL target; 0 = native
    batch_size: 64
    concurrency: 4
    timeout: 60s

destinations:
  - name: local-pgvector
    driver: pgvector
    dsn_env: INGET_PGVECTOR_DSN
    table: inget_vectors
    storage: halfvec                   # halfvec | vector
    hnsw: { m: 24, ef_construction: 200 }
    ef_search: 100
    granularity: item                  # item | fragment
    batch_size: 500

sources:
  - name: github
    driver: github
    auth:
      token_env: INGET_GITHUB_TOKEN
      api_url: "https://api.github.com"
    domain:
      orgs: ["maxwell-cudlitz"]
      repos: []
      topics: []
      visibility: all                  # all | public | private
      include_archived: false
      include_forks: false
      max_inactive_days: 365
    limits:
      requests_per_second: 10
      max_concurrent: 4
      tarball_max_bytes: 33554432
      secret_scan: true                # exclude file content matching the gitleaks ruleset

  - name: monday
    driver: monday
    auth:
      token_env: INGET_MONDAY_TOKEN
      api_url: "https://api.monday.com/v2"
      api_version: "2026-07"
    domain:
      workspaces: []
      boards: [1234567890]
      include_updates: true
      include_subitems: false
    limits:
      complexity_reserve: 250000       # keep this much budget in hand
      max_concurrent: 8
      page_size: 500

datatypes:
  - name: github/repo
    source: github
    enricher: llm
    fragment_enricher:
      enabled: true
      prompt: prompts/github/repo/fragment.tmpl
      max_input_chars: 8000            # per-file bound; content over it is truncated, not
                                       # rejected. The main cost control: derivation is one
                                       # call per file, so an unbounded file is an unbounded
                                       # bill.
    compose:
      order: tier                      # tier | path
      # Sized to hold every file summary of every repository in the sample corpus: the largest
      # is 2,214 files at about 1.02M characters of derived text. At 100000 fifteen of fifty
      # items lost their tail on the "**"-scoped views, and covering all of them costs about
      # $0.35 across the corpus, because what is composed is summaries rather than source.
      #
      # Tier order still decides what a truncation would drop first (docs, then entrypoints,
      # then config, then source), so lowering this degrades gracefully rather than randomly.
      # Config validation keeps it under models.generator.max_input_chars with room for the
      # prompt template around it.
      max_chars: 1100000
    destinations: [local-pgvector]
    views:
      - name: role
        prompt: prompts/github/repo/role.tmpl
        depends_on: ["**"]
      - name: surface
        prompt: prompts/github/repo/surface.tmpl
        depends_on: ["cmd/**", "**/api/**", "**/routes/**", "**/handlers/**",
                     "*.proto", "**/*.graphql", "openapi*", "swagger*",
                     "**/main.*", "**/index.*", "README*"]
      - name: internals
        prompt: prompts/github/repo/internals.tmpl
        depends_on: ["**"]
      - name: stack
        prompt: prompts/github/repo/stack.tmpl
        # go.sum and other lockfiles are dropped by the connector's noise filter, so a glob
        # naming one would never match. The manifest beside each lockfile is what says what
        # the project depends on.
        depends_on: ["go.mod", "package.json", "pyproject.toml",
                     "requirements.txt", "Cargo.toml", "pom.xml", "build.gradle*",
                     "*.tf", "Dockerfile*", "docker-compose*", "Makefile"]
      - name: integrations
        prompt: prompts/github/repo/integrations.tmpl
        depends_on: ["*.tf", "helm/**", "charts/**", "k8s/**",
                     ".github/workflows/**", "**/client*", "**/config*"]
      - name: stewardship
        prompt: prompts/github/repo/stewardship.tmpl
        depends_on: ["CODEOWNERS", ".github/**", "docs/**", "README*", "AGENTS.md"]
      - name: operations
        prompt: prompts/github/repo/operations.tmpl
        depends_on: ["Dockerfile*", "docker-compose*", "Makefile", "helm/**",
                     "k8s/**", ".github/workflows/**", "config*", "deploy/**"]
      - name: aliases
        prompt: prompts/github/repo/aliases.tmpl
        depends_on: ["**"]

  - name: monday/item
    source: monday
    enricher: llm
    fragment_enricher:
      enabled: false                   # columns are already short; no per-column LLM
    destinations: [local-pgvector]
    references:
      - name: linked_repo
        resolver: inget
        datatype: github/repo
        key_from: "column:repo_url"
        # The column holds a URL; a github/repo item is keyed "owner/name". The capture group
        # is what bridges the two, so no resolver has to know what a GitHub URL looks like.
        key_regex: 'github\.com/([^/"?#]+/[^/"?#.]+)'
        fields: [description, "view:role"]
        inject_as: fragment
    metadata_fields:
      related_keys: "${references.*.resolved_keys}"
    views:
      - name: substance
        prompt: prompts/monday/item/substance.tmpl
        depends_on: ["**"]
      - name: progress
        prompt: prompts/monday/item/progress.tmpl
        depends_on: ["column:status", "column:date*", "column:person*", "update:*"]
