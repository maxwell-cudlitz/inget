# golangci-lint v2 configuration. Kept small on purpose: the standard set plus the
# linters that catch the mistakes this codebase is most exposed to — unchecked errors,
# unwrapped errors at boundaries, and resource leaks in the HTTP and database clients.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wrapcheck
  settings:
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
      # wrapcheck's premise is that an error crossing a package boundary carries no context
      # about what failed. That is true of third-party code and false of this module's own
      # packages: each wraps at its own boundary, and their messages are asserted by tests
      # ("migrating postgres state store: ...", "binding destination inget_vectors to ...").
      # Wrapping those a second time in a caller repeats the same phrase rather than adding
      # anything, so an entrypoint assembling them is exempt. Errors from outside the module
      # are still checked everywhere.
      ignore-package-globs:
        - github.com/maxwellcudlitz/inget/internal/*
  exclusions:
    generated: lax
    rules:
      # Test helpers legitimately return unwrapped errors and use fixture values.
      - path: _test\.go
        linters:
          - wrapcheck

formatters:
  enable:
    - gofmt
