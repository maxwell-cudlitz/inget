# Release on tag: test, then build and publish binaries and the multi-arch image.
#
# The test job repeats the PostgreSQL/pgvector integration coverage from ci.yaml because
# a tag can be pushed at any commit. It uses only a disposable database and synthetic
# model responses. Live-model quality cases remain opt-in.
#
# GITHUB_TOKEN has contents:write for release assets and packages:write for GHCR.
# Homebrew upload is opt-in through repository variable PUBLISH_HOMEBREW_CASK=true.
# It requires HOMEBREW_TAP_TOKEN with push access to an existing homebrew-tap repository;
# validate that prerequisite before publishing any archives or images.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Two tags pushed together would race for the same release assets and the same tap commit.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: inget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inget_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable service credentials, never an application secret.
      INGET_TEST_PG: postgres://postgres:fixture-only@127.0.0.1:5432/inget_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare pgvector extension
        run: >-
          docker exec "${{ job.services.pgvector.id }}"
          psql -U postgres -d inget_test -v ON_ERROR_STOP=1
          -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - run: go vet ./...
      - run: go test -race ./...

  release:
    name: goreleaser
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      # An unset repository variable keeps archives/image independent of a tap token.
      PUBLISH_HOMEBREW_CASK: ${{ vars.PUBLISH_HOMEBREW_CASK || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser derives the version and the changelog from tags, so a shallow clone
          # reports the wrong version or none at all.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate optional Homebrew publication
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          case "$PUBLISH_HOMEBREW_CASK" in
            false) exit 0 ;;
            true) ;;
            *)
              echo "::error::PUBLISH_HOMEBREW_CASK must be true or false"
              exit 1
              ;;
          esac
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Homebrew publication requires HOMEBREW_TAP_TOKEN"
            exit 1
          fi
          if ! can_push=$(gh api repos/maxwell-cudlitz/homebrew-tap --jq '.permissions.push // false'); then
            echo "::error::Cannot verify access to maxwell-cudlitz/homebrew-tap"
            exit 1
          fi
          if [ "$can_push" != true ]; then
            echo "::error::HOMEBREW_TAP_TOKEN needs push access to maxwell-cudlitz/homebrew-tap"
            exit 1
          fi

      # No QEMU: the Dockerfile only copies pre-built binaries, so nothing is executed for
      # the target platform and a cross-platform build needs no emulation. Adding a RUN
      # instruction to it would change that.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pinned, like golangci-lint in the Makefile: a release pipeline that changes
          # under you is not a release pipeline.
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
