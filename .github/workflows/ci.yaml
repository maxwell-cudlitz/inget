# Continuous integration: vet, lint and test on every push and pull request.
#
# A disposable pgvector service exercises the PostgreSQL state, destination and
# restricted-role query suites. The fixture administrator creates test-only roles;
# no application database, cloud credentials or private corpus is used. Live-model
# quality cases remain gated behind their own environment variable.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: inget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inget_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable service credentials, never an application secret.
      INGET_TEST_PG: postgres://postgres:fixture-only@127.0.0.1:5432/inget_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare pgvector extension
        run: >-
          docker exec "${{ job.services.pgvector.id }}"
          psql -U postgres -d inget_test -v ON_ERROR_STOP=1
          -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
