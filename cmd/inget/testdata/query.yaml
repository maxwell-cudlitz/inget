# Query-only fixture deliberately names unavailable writer/model credentials and paths.
# Preflight and --rerank=false must not need those dependencies.
version: 1
log: {level: info, format: json, destination: stderr}
artifacts:
  url: file:///nonexistent-query-artifacts
  shard_target_bytes: 1024
  blob_max_bytes: 512
  max_fragments_per_item: 10
  compression: zstd
retention: {runs: 7d, missing_runs: 2}
enrich: {max_reference_depth: 1, max_cascade_per_run: 100}
state: {driver: postgres, dsn_env: INGET_QUERY_UNUSED_STATE}
models:
  generator:
    driver: openai
    base_url: http://127.0.0.1:1/v1
    model: unused-generator
    api_key_env: INGET_QUERY_UNUSED_GENERATOR
    temperature: 0
    seed: 1
    max_output_tokens: 128
    max_input_chars: 4096
    concurrency: 1
    timeout: 1s
    price_per_mtok_in: 0.1
    price_per_mtok_out: 0.2
  embedder:
    driver: openai
    base_url: http://127.0.0.1:1/v1
    model: query-test
    api_key_env: INGET_QUERY_TEST_EMBEDDER_KEY
    dimensions: 4
    truncate_dims: 0
    batch_size: 4
    concurrency: 1
    timeout: 1s
  reranker:
    driver: openai
    base_url: http://127.0.0.1:1/v1
    model: unused-reranker
    api_key_env: INGET_QUERY_UNUSED_RERANKER
    max_output_tokens: 128
    max_input_chars: 4096
    concurrency: 1
    timeout: 1s
query:
  rerank:
    enabled: true
    candidates: 10
    max_candidate_chars: 200
    prompt: /nonexistent-query-rerank.tmpl
destinations:
  - name: vectors
    driver: pgvector
    dsn_env: INGET_QUERY_TEST_DSN
    table: inget_query_test
    storage: halfvec
    hnsw: {m: 16, ef_construction: 64}
    ef_search: 40
    granularity: item
    batch_size: 10
sources:
  - name: github
    driver: github
    auth: {token_env: INGET_QUERY_UNUSED_SOURCE, api_url: https://api.github.com}
    domain: {orgs: [synthetic]}
    limits: {requests_per_second: 5}
datatypes:
  - name: github/repo
    source: github
    enricher: llm
    fragment_enricher: {enabled: false}
    compose: {order: tier, max_chars: 3000}
    destinations: [vectors]
    views:
      - name: role
        prompt: /nonexistent-query-view.tmpl
        depends_on: ["**"]
